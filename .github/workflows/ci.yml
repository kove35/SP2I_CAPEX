name: SP2I CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sp2i_capex_test
          POSTGRES_USER: sp2i_test
          POSTGRES_PASSWORD: sp2i_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sp2i_test -d sp2i_capex_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://sp2i_test:sp2i_test_password@localhost:5432/sp2i_capex_test
      ENVIRONMENT: test
      SP2I_JWT_SECRET: ci-only-secret-with-at-least-32-characters
      ALLOW_STARTUP_SCHEMA_MUTATIONS: "true"
      SP2I_FACT_SOURCE: fact_metre
      SP2I_FINANCIAL_SOURCE: fact_metre
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 07_API_BACKEND/requirements-dev.txt
      - name: Install Cairo build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libcairo2-dev
      - run: python -m pip install -r 07_API_BACKEND/requirements-dev.txt
      - run: python -m compileall -q 07_API_BACKEND/app
      - name: Initialize isolated test schema
        run: PYTHONPATH=07_API_BACKEND python -c "from app.main import startup; startup()"
      - name: Run backend tests
        # tests/test_api.py is a live, populated-environment reconciliation
        # smoke test. Hermetic API tests use FastAPI TestClient instead.
        run: PYTHONPATH=07_API_BACKEND python -m pytest -q --ignore=tests/test_api.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 08_FRONTEND
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: 08_FRONTEND/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
