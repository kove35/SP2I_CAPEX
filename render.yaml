services:
  - type: web
    name: sp2i-backend
    runtime: python
    rootDir: .
    plan: free
    region: frankfurt
    # Le déploiement reste manuel tant que la checklist de sécurité n'est pas validée.
    autoDeploy: false

    buildCommand: |
      pip install --upgrade pip
      pip install -r 07_API_BACKEND/requirements.txt

    startCommand: >-
      python -m uvicorn app.main:app --app-dir 07_API_BACKEND --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"

    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8

      - key: ENVIRONMENT
        value: production

      - key: SP2I_JWT_SECRET
        sync: false

      - key: LOG_LEVEL
        value: INFO

      - key: SP2I_CLOUD_MODE
        value: "true"

      - key: SP2I_DATASET_VERSION
        value: V1_ENTERPRISE

      - key: DATABASE_URL
        sync: false

      - key: DB_POOL_SIZE
        value: "5"

      - key: DB_MAX_OVERFLOW
        value: "5"

      - key: DB_POOL_TIMEOUT
        value: "10"

      - key: DB_POOL_RECYCLE
        value: "1800"

      - key: DB_CONNECT_TIMEOUT
        value: "10"

      - key: FRONTEND_URL
        sync: false

      - key: CORS_ORIGINS
        value: https://sp-2-i-capex.vercel.app

      - key: CORS_ORIGIN_REGEX
        value: ""

      - key: ALLOW_STARTUP_SCHEMA_MUTATIONS
        value: "false"

      - key: ENABLE_DB_REQUEST_METRICS
        value: "false"

      - key: OPENAI_API_KEY
        sync: false

      - key: OPENAI_FAST_MODEL
        value: gpt-4.1-mini

      - key: OPENAI_HEAVY_MODEL
        value: gpt-4.1

      - key: MAX_UPLOAD_MB
        value: "25"

      - key: ALLOWED_EXTENSIONS
        value: xlsx,xls,csv,pdf

      - key: PROCUREMENT_DEFAULT_COUNTRY
        value: china

      - key: PROCUREMENT_DEFAULT_CURRENCY
        value: FCFA

      - key: ANALYTICS_CACHE_TTL
        value: "300"
